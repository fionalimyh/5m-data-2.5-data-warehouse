version: 2

models:
  - name: fact_trips       
    description: "One row per completed bike trip — central fact table"
    columns:
      - name: trip_id
        tests:
          - unique
          - not_null
      - name: start_station_id
        tests:
          - not_null
      - name: end_station_id
      - name: duration_minutes
        tests:
          - not_null